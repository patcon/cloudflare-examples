<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Teleporter</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <h1>Session Teleporter</h1>

  <p>This page simulates moving a session ID between two devices, relayed by a Cloudflare Durable Object. Pair two devices, then either one can send its session or ask for the other's.</p>

  <div id="sessionInfo">
    <p><strong>Session ID:</strong> <span id="sessionId"></span></p>
    <p id="previousInfo" class="hidden">
      <strong>Previous:</strong> <span id="previousId"></span>
      <button id="switchBack">Switch back</button>
    </p>
  </div>

  <div>
    <button id="generate">Generate Transfer Link</button>
    <button id="showPinBtn">Have a PIN?</button>

    <div id="linkArea" class="hidden">
      <p><strong>Transfer URL:</strong> <span id="joinUrl"></span></p>
      <canvas id="qr"></canvas>
    </div>

    <div id="pinSection" class="hidden">
      <input id="pinInput" placeholder="Enter PIN" />
      <button id="joinByPin">Pair</button>
    </div>

    <p id="status"></p>

    <div id="pairedActions" class="hidden">
      <button id="sendMine">Send my session →</button>
      <button id="askTheirs">← Ask for theirs</button>
    </div>

    <div id="prompt" class="hidden">
      <p id="promptText"></p>
      <button id="promptYes"></button>
      <button id="promptNo"></button>
    </div>
  </div>

  <script type="module" src="./dist/client.js"></script>
</body>
</html>
